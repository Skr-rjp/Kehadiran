    <script>
function initFirestoreSync() {
        Object.values(STORAGE_KEYS).forEach(key => {
            dbFirestore.collection('istar_data').doc(key).onSnapshot((doc) => {
                if (doc.exists) {
                    localCache[key] = doc.data().value;
                } else {
                    // Jika dokumen belum ada di Firestore, buat data default
                    let defaultData = getDefaultValueForKey(key);
                    dbFirestore.collection('istar_data').doc(key).set({ value: defaultData });
                    localCache[key] = defaultData;
                }
                render();
            });
        });
    }

    function getDefaultValueForKey(key) {
        switch(key) {
            case STORAGE_KEYS.SETTINGS:
                return { appName: 'Sistem Piket & Absensi ISTAR', schoolName: 'ISTAR Sekolah' };
            case STORAGE_KEYS.STUDENTS:
                return [
                    { nisn: '1001', name: 'Ahmad Fauzi', className: '10 IPA 1', password: '123' },
                    { nisn: '1002', name: 'Siti Rahma', className: '10 IPA 1', password: '123' }
                ];
            case STORAGE_KEYS.GURU_PIKET:
                return [{ code: 'GP01', name: 'Drs. H. Mulyana', password: 'gp1' }];
            case STORAGE_KEYS.VIOLATION_RULES:
                return [{ id: 1, name: 'Terlambat hadir ke sekolah (> 15 menit)', points: 10 }];
            default:
                return [];
        }
    }

    initFirestoreSync();

const db = {
        getSettings: () => localCache[STORAGE_KEYS.SETTINGS],
        setSettings: (s) => {
            localCache[STORAGE_KEYS.SETTINGS] = s;
            dbFirestore.collection('istar_data').doc(STORAGE_KEYS.SETTINGS).set({ value: s });
        },

        getStudents: () => localCache[STORAGE_KEYS.STUDENTS] || [],
        setStudents: (d) => {
            localCache[STORAGE_KEYS.STUDENTS] = d;
            dbFirestore.collection('istar_data').doc(STORAGE_KEYS.STUDENTS).set({ value: d });
        },

        getGuru: () => localCache[STORAGE_KEYS.GURU_PIKET] || [],
        setGuru: (d) => {
            localCache[STORAGE_KEYS.GURU_PIKET] = d;
            dbFirestore.collection('istar_data').doc(STORAGE_KEYS.GURU_PIKET).set({ value: d });
        },

        },

        },

            dbFirestore.collection('istar_data').doc(STORAGE_KEYS.VIOLATIONS).set({ value: d });
        },

        getSession: () => localCache[STORAGE_KEYS.SESSION] || { role: null, user: null },
        setSession: (s) => {
            localCache[STORAGE_KEYS.SESSION] = s;
            localStorage.setItem(STORAGE_KEYS.SESSION, JSON.stringify(s));

        let modalState = { show: false, title: '', message: '', type: 'info', onConfirm: null };

        function showModal(title, message, type = 'info', onConfirm = null) {
            modalState = { show: true, title, message, type, onConfirm };
            render();
        }

        function closeModal() {
            modalState = { show: false, title: '', message: '', type: 'info', onConfirm: null };
            render();
        }

        let currentTab = 'dashboard';
        let activeLoginRole = 'admin';
        
        // Guru filter & tab state
        let guruSelectedClass = '';
        let guruSelectedDate = new Date().toISOString().split('T')[0];
        let guruActiveTab = 'entry'; // 'entry' | 'recap'

        let recapFilter = {
            class: '',
            type: 'monthly',
            startDate: '',
            endDate: ''
        };

        function setAdminTab(tabName) {
            currentTab = tabName;
            if (tabName === 'recap') {
                const students = db.getStudents();
                const classes = [...new Set(students.map(s => s.className))];
                if (classes.length > 0 && !recapFilter.class) {
                    recapFilter.class = classes[0];
                }
                setRecapPeriod('monthly');
            }
            render();
        }

        function setRecapPeriod(periodType) {
            recapFilter.type = periodType;
            const today = new Date();
            let start = new Date();
            let end = new Date();

            if (periodType === 'weekly') {
                start.setDate(today.getDate() - 6);
            } else if (periodType === 'monthly') {
                start = new Date(today.getFullYear(), today.getMonth(), 1);
                end = new Date(today.getFullYear(), today.getMonth() + 1, 0);
            } else if (periodType === 'semester') {
                const currentMonth = today.getMonth();
                if (currentMonth >= 6) {
                    start = new Date(today.getFullYear(), 6, 1);
                    end = new Date(today.getFullYear(), 11, 31);
                } else {
                    start = new Date(today.getFullYear(), 0, 1);
                    end = new Date(today.getFullYear(), 5, 30);
                }
            }

            recapFilter.startDate = formatDateInput(start);
            recapFilter.endDate = formatDateInput(end);
            render();
        }

        function formatDateInput(dateObj) {
            const yyyy = dateObj.getFullYear();
            const mm = String(dateObj.getMonth() + 1).padStart(2, '0');
            const dd = String(dateObj.getDate()).padStart(2, '0');
            return `${yyyy}-${mm}-${dd}`;
        }

        function updateRecapFilter(field, value) {
            recapFilter[field] = value;
            if (field === 'startDate' || field === 'endDate') {
                recapFilter.type = 'custom';
            }
            render();
        }

        function render() {
            const session = db.getSession();
            const appEl = document.getElementById('app');

            if (!session.role) {
                appEl.innerHTML = renderLoginView();
                setLoginTab(activeLoginRole);
            } else if (session.role === 'admin') {
                appEl.innerHTML = renderAdminLayout(session.user);
            } else if (session.role === 'guru') {
                appEl.innerHTML = renderGuruLayout(session.user);
            } else if (session.role === 'siswa') {
                appEl.innerHTML = renderSiswaLayout(session.user);
            }

            if (modalState.show) {
                appEl.innerHTML += renderModalComponent();
            }

            lucide.createIcons();
        }

        function renderLoginView() {
            const settings = db.getSettings();
            return `

                                <button onclick="setLoginTab('guru')" id="tab-btn-guru" class="py-2.5 rounded-lg transition-all ${activeLoginRole === 'guru' ? 'bg-indigo-600 text-white shadow' : 'text-slate-300 hover:text-white'}">Guru Piket</button>
                                <button onclick="setLoginTab('siswa')" id="tab-btn-siswa" class="py-2.5 rounded-lg transition-all ${activeLoginRole === 'siswa' ? 'bg-indigo-600 text-white shadow' : 'text-slate-300 hover:text-white'}">Siswa</button>

        function setLoginTab(role) {
            activeLoginRole = role;
            document.querySelectorAll('[id^="tab-btn-"]').forEach(btn => {

            if (activeBtn) activeBtn.className = "py-2.5 rounded-lg transition-all bg-indigo-600 text-white shadow";
            
            const fieldsContainer = document.getElementById('loginFields');
            if (!fieldsContainer) return;

            if (role === 'admin') {

            } else if (role === 'guru') {

                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-300 mb-1">Password</label>
                            <div class="relative">

                                </button>
                            </div>
                        </div>

                `;
            } else if (role === 'siswa') {
                fieldsContainer.innerHTML = `
                    <div class="space-y-3">
                        <div>
                            <label class="block text-xs font-medium text-slate-300 mb-1">NISN Siswa</label>
                            <input type="text" id="siswaNisnInput" required placeholder="Masukkan NISN Anda" class="w-full px-4 py-3 rounded-xl bg-slate-900/80 border border-slate-700 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-300 mb-1">Password</label>
                            <div class="relative">
                                <input type="password" id="siswaPass" required placeholder="Password siswa" class="w-full px-4 py-3 rounded-xl bg-slate-900/80 border border-slate-700 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 pr-10">
                                <button type="button" onclick="togglePasswordVisibility('siswaPass', 'eyeSiswa')" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white">
                                    <i id="eyeSiswa" data-lucide="eye" class="w-5 h-5"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }
            lucide.createIcons();
        }

        function togglePasswordVisibility(fieldId, iconId) {
            const inputField = document.getElementById(fieldId);
            const iconElement = document.getElementById(iconId);
            if (!inputField || !iconElement) return;
            if (inputField.type === 'password') {
                inputField.type = 'text';
                iconElement.setAttribute('data-lucide', 'eye-off');
            } else {
                inputField.type = 'password';
                iconElement.setAttribute('data-lucide', 'eye');
            }
            lucide.createIcons();
        }

        function handleLogin(e) {
            e.preventDefault();
            if (activeLoginRole === 'admin') {
                const passField = document.getElementById('adminPass');
                const pass = passField ? passField.value : '';
                if (pass === 'ISTARATAS_061') {
                    db.setSession({ role: 'admin', user: { name: 'Administrator' } });
                    render();
                } else {
                    showModal('Login Gagal', 'Password Admin salah!', 'error');
                }
            } else if (activeLoginRole === 'guru') {
                const codeField = document.getElementById('guruCodeInput');
                const passField = document.getElementById('guruPass');
                const code = codeField ? codeField.value.trim() : '';
                const pass = passField ? passField.value : '';
                const guruList = db.getGuru();
                const found = guruList.find(g => g.code === code && g.password === pass);
                if (found) {
                    db.setSession({ role: 'guru', user: found });
                    render();
                } else {
                    showModal('Login Gagal', 'Kode guru atau password salah!', 'error');
                }
            } else if (activeLoginRole === 'siswa') {
                const nisnField = document.getElementById('siswaNisnInput');
                const passField = document.getElementById('siswaPass');
                const nisn = nisnField ? nisnField.value.trim() : '';
                const pass = passField ? passField.value : '';
                const studentList = db.getStudents();
                const found = studentList.find(s => s.nisn === nisn && s.password === pass);
                if (found) {
                    db.setSession({ role: 'siswa', user: found });
                    render();
                } else {
                    showModal('Login Gagal', 'NISN atau password siswa salah!', 'error');
                }
            }
        }

            db.setSession({ role: null, user: null });
            currentTab = 'dashboard';

            return titles[currentTab] || 'Admin';

                const attGurus = [...new Set(studentAtt.map(a => a.guruName || a.guruCode).filter(Boolean))];

                const studentVios = violations.filter(v => {
                    return v.nisn === s.nisn && (!startDate || v.date >= startDate) && (!endDate || v.date <= endDate);
                });

                let totalPoints = 0;
                const violationList = studentVios.map(v => {
                    const r = rules.find(rule => rule.id === v.ruleId);
                    const pts = r ? r.points : 0;
                    totalPoints += pts;
                    const tName = v.guruName ? ` - Guru: ${v.guruName}` : '';
                    return `[${v.date}] ${r ? r.name : 'Pelanggaran'}${tName} (${pts} Poin)`;
                });

                const vioGurus = [...new Set(studentVios.map(v => v.guruName || v.guruCode).filter(Boolean))];
                const allGurus = [...new Set([...attGurus, ...vioGurus])].join(', ') || '-';

                return {
                    'No': idx + 1,
                    'NISN': s.nisn,
                    'Nama Siswa': s.name,
                    'Kelas': s.className,
                    'Periode Rekap': `${startDate || 'Awal'} s/d ${endDate || 'Akhir'}`,
                    'Hadir': hadir,
                    'Sakit': sakit,
                    'Izin': izin,
                    'Alpha': alpha,
                    'Total Poin Pelanggaran': totalPoints,
                    'Guru Piket Pengisi': allGurus,
                    'Rincian Pelanggaran': violationList.length > 0 ? violationList.join(' | ') : 'Tidak Ada Pelanggaran'
                };
            });

            const ws = XLSX.utils.json_to_sheet(exportRows);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, `Rekap ${selectedClass}`);
            XLSX.writeFile(wb, `Rekap_Kelas_${selectedClass}_${recapFilter.type}_${startDate}_sd_${endDate}.xlsx`);
        }

        function saveAllAttendance() {
            const session = db.getSession();
            const teacher = session.user || {};
            const students = db.getStudents().filter(s => s.className === guruSelectedClass);

            if (students.length === 0) {
                showModal('Peringatan', 'Tidak ada siswa di kelas ini.', 'warning');
                return;
            }

            let attendance = db.getAttendance();
            const date = guruSelectedDate;

            // Remove existing record for this class & date to overwrite completely
            const nisnList = students.map(s => s.nisn);
            attendance = attendance.filter(a => !(a.date === date && nisnList.includes(a.nisn)));

            students.forEach(s => {
                const statusEl = document.getElementById(`status_${s.nisn}`);
                const noteEl = document.getElementById(`note_${s.nisn}`);

                const status = statusEl ? statusEl.value : 'Hadir';
                const notes = noteEl ? noteEl.value : '';

                attendance.push({
                    id: 'a_' + Date.now() + Math.random(),
                    nisn: s.nisn,
                    date,
                    status,
                    notes,
                    guruCode: teacher.code || '',
                    guruName: teacher.name || 'Guru Piket'
                });
            });

            db.setAttendance(attendance);
            showModal('Berhasil', `Seluruh presensi siswa Kelas ${guruSelectedClass} untuk tanggal ${date} berhasil disimpan!`, 'success');
        }

        function handleGuruViolation(e) {
            e.preventDefault();
            const session = db.getSession();
            const teacher = session.user || {};
            const nisnEl = document.getElementById('vNisn');
            const ruleEl = document.getElementById('vRuleId');

            const nisn = nisnEl ? nisnEl.value : '';
            const ruleId = ruleEl ? parseInt(ruleEl.value) : 1;
            const date = guruSelectedDate;

            if (!nisn) {
                showModal('Peringatan', 'Silakan pilih siswa terlebih dahulu!', 'warning');
                return;
            }

            const violations = db.getViolations();
            violations.push({
                id: 'v_' + Date.now(),
                nisn,
                ruleId,
                date,
                note: '',
                guruCode: teacher.code || '',
                guruName: teacher.name || 'Guru Piket'
            });
            db.setViolations(violations);
            showModal('Berhasil', 'Pelanggaran berhasil dicatat.', 'success');
        }

                                            <tr>
                                                <td class="p-3 font-medium text-slate-900">${a.date}</td>
                                                <td class="p-3">
                                                    <span class="px-2.5 py-1 rounded-lg text-xs font-bold ${
                                                        a.status === 'Hadir' ? 'bg-emerald-100 text-emerald-700' :
                                                        a.status === 'Sakit' ? 'bg-sky-100 text-sky-700' :
                                                        a.status === 'Izin' ? 'bg-amber-100 text-amber-700' : 'bg-rose-100 text-rose-700'
                                                    }">${a.status}</span>
                                                </td>
                                                <td class="p-3 text-slate-600 text-xs">${a.notes || '-'}</td>
                                            </tr>
                                        `).join('')}
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4">
                            <h3 class="font-bold text-base text-slate-900">Riwayat Pelanggaran & Sanksi Poin</h3>
                            <div class="overflow-x-auto">
                                <table class="w-full text-left border-collapse text-sm">
                                    <thead>
                                        <tr class="bg-slate-50 border-b border-slate-200 text-slate-600 font-semibold">
                                            <th class="p-3">Tanggal</th>
                                            <th class="p-3">Jenis Pelanggaran</th>
                                            <th class="p-3">Poin</th>
                                        </tr>
                                    </thead>
                                    <tbody class="divide-y divide-slate-100">
                                        ${detailedViolations.length === 0 ? '<tr><td colspan="3" class="p-4 text-center text-slate-400">Bersih! Tidak ada catatan pelanggaran.</td></tr>' : ''}
                                        ${detailedViolations.map(v => `
                                            <tr>
                                                <td class="p-3 font-medium text-slate-900">${v.date}</td>
                                                <td class="p-3 text-slate-700">${v.ruleName}</td>
                                                <td class="p-3"><span class="px-2.5 py-1 bg-rose-100 text-rose-700 rounded-lg text-xs font-bold">+${v.points}</span></td>
                                            </tr>
                                        `).join('')}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </main>
                </div>
            `;
        }

        function downloadStudentTemplate() {
            const templateData = [
                { NISN: '1004', 'Nama Lengkap': 'Contoh Siswa', Kelas: '10 IPA 1', Password: '123' }
            ];
            const ws = XLSX.utils.json_to_sheet(templateData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Template Siswa");
            XLSX.writeFile(wb, "Template_Data_Siswa.xlsx");
        }

        function handleStudentUpload(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                try {
                    const data = new Uint8Array(evt.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    const jsonData = XLSX.utils.sheet_to_json(worksheet);

                    const students = db.getStudents();
                    let addedCount = 0;
                    jsonData.forEach(row => {
                        const nisn = String(row.NISN || row.nisn || '');
                        const name = row['Nama Lengkap'] || row.nama || '';
                        const className = row.Kelas || row.kelas || '';
                        const password = String(row.Password || row.password || '123');

                        if (nisn && name && className) {
                            if (!students.some(s => s.nisn === nisn)) {
                                students.push({ nisn, name, className, password });
                                addedCount++;
                            }
                        }
                    });

                    db.setStudents(students);
                    showModal('Berhasil Import', `Berhasil menambahkan ${addedCount} data siswa dari Excel!`, 'success');
                } catch (err) {
                    showModal('Gagal', 'Format file Excel tidak valid.', 'error');
                }
            };
            reader.readAsArrayBuffer(file);
        }

        function deleteStudent(nisn) {
            showModal('Konfirmasi Hapus', 'Apakah Anda yakin ingin menghapus data siswa ini?', 'warning', () => {
                let students = db.getStudents();
                students = students.filter(s => s.nisn !== nisn);
                db.setStudents(students);
                closeModal();
                render();
            });
        }

        function deleteGuru(code) {
            showModal('Konfirmasi Hapus', 'Apakah Anda yakin ingin menghapus akun guru piket ini?', 'warning', () => {
                let guru = db.getGuru();
                guru = guru.filter(g => g.code !== code);
                db.setGuru(guru);
                closeModal();
                render();
            });
        }

        function deleteRule(id) {
            showModal('Konfirmasi Hapus', 'Apakah Anda yakin ingin menghapus aturan poin pelanggaran ini?', 'warning', () => {
                let rules = db.getRules();
                rules = rules.filter(r => r.id !== id);
                db.setRules(rules);
                closeModal();
                render();
            });
        }

        function deleteViolationRecord(violationId) {
            showModal('Konfirmasi Hapus Pelanggaran', 'Apakah Anda yakin ingin menghapus catatan pelanggaran siswa ini?', 'warning', () => {
                let violations = db.getViolations();
                violations = violations.filter(v => v.id !== violationId);
                db.setViolations(violations);
                closeModal();
                render();
            });
        }

        function openAddStudentModal() {
            showModal('Tambah Siswa Manual', `
                <form onsubmit="saveNewStudent(event)" class="space-y-4 text-left pt-2">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">NISN</label>
                        <input type="text" id="newNisn" required class="w-full px-3 py-2 border rounded-xl text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Nama Lengkap</label>
                        <input type="text" id="newName" required class="w-full px-3 py-2 border rounded-xl text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Kelas</label>
                        <input type="text" id="newClass" required placeholder="Contoh: 10 IPA 1" class="w-full px-3 py-2 border rounded-xl text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Password Login Siswa</label>
                        <input type="text" id="newPass" required value="123" class="w-full px-3 py-2 border rounded-xl text-sm">
                    </div>
                    <button type="submit" class="w-full py-2.5 bg-indigo-600 text-white rounded-xl text-sm font-semibold">Simpan Siswa</button>
                </form>
            `, 'custom');
        }

        function saveNewStudent(e) {
            e.preventDefault();
            const nisnEl = document.getElementById('newNisn');
            const nameEl = document.getElementById('newName');
            const classEl = document.getElementById('newClass');
            const passEl = document.getElementById('newPass');

            const nisn = nisnEl ? nisnEl.value : '';
            const name = nameEl ? nameEl.value : '';
            const className = classEl ? classEl.value : '';
            const password = passEl ? passEl.value : '123';

            let students = db.getStudents();
            if (students.some(s => s.nisn === nisn)) {
                showModal('Peringatan', 'NISN sudah terdaftar!', 'error');
                return;
            }
            students.push({ nisn, name, className, password });
            db.setStudents(students);
            closeModal();
            render();
        }

        function openAddGuruModal() {
            showModal('Tambah Guru Piket', `
                <form onsubmit="saveNewGuru(event)" class="space-y-4 text-left pt-2">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Kode Guru</label>
                        <input type="text" id="gCode" required placeholder="Contoh: GP03" class="w-full px-3 py-2 border rounded-xl text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Nama Lengkap & Gelar</label>
                        <input type="text" id="gName" required placeholder="Contoh: Budi, S.Pd" class="w-full px-3 py-2 border rounded-xl text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Password Login</label>
                        <input type="text" id="gPass" required value="gp123" class="w-full px-3 py-2 border rounded-xl text-sm">
                    </div>
                    <button type="submit" class="w-full py-2.5 bg-indigo-600 text-white rounded-xl text-sm font-semibold">Simpan Guru Piket</button>
                </form>
            `, 'custom');
        }

        function saveNewGuru(e) {
            e.preventDefault();
            const codeEl = document.getElementById('gCode');
            const nameEl = document.getElementById('gName');
            const passEl = document.getElementById('gPass');

            const code = codeEl ? codeEl.value : '';
            const name = nameEl ? nameEl.value : '';
            const password = passEl ? passEl.value : 'gp123';

            let guru = db.getGuru();
            guru.push({ code, name, password });
            db.setGuru(guru);
            closeModal();
            render();
        }

        function openAddRuleModal() {
            showModal('Tambah Aturan Pelanggaran', `
                <form onsubmit="saveNewRule(event)" class="space-y-4 text-left pt-2">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Nama / Bentuk Pelanggaran</label>
                        <input type="text" id="rName" required class="w-full px-3 py-2 border rounded-xl text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Besar Poin</label>
                        <input type="number" id="rPoints" required value="10" class="w-full px-3 py-2 border rounded-xl text-sm">
                    </div>
                    <button type="submit" class="w-full py-2.5 bg-indigo-600 text-white rounded-xl text-sm font-semibold">Simpan Aturan</button>
                </form>
            `, 'custom');
        }

        function saveNewRule(e) {
            e.preventDefault();
            const nameEl = document.getElementById('rName');
            const pointsEl = document.getElementById('rPoints');

            const name = nameEl ? nameEl.value : '';
            const points = pointsEl ? parseInt(pointsEl.value) : 10;

            let rules = db.getRules();
            const newId = rules.length ? Math.max(...rules.map(r => r.id)) + 1 : 1;
            rules.push({ id: newId, name, points });
            db.setRules(rules);
            closeModal();
            render();
        }

        function renderModalComponent() {
            return `
                <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-200 animate-in fade-in zoom-in duration-200">
                        ${modalState.type === 'custom' ? `
                            <div class="flex items-center justify-between mb-4">
                                <h3 class="font-bold text-lg text-slate-900">${modalState.title}</h3>
                                <button onclick="closeModal()" class="p-1 hover:bg-slate-100 rounded-lg"><i data-lucide="x" class="w-5 h-5 text-slate-500"></i></button>
                            </div>
                            <div>${modalState.message}</div>
                        ` : `
                            <div class="text-center space-y-4">
                                <div class="w-12 h-12 rounded-full mx-auto flex items-center justify-center ${modalState.type === 'error' ? 'bg-rose-100 text-rose-600' : 'bg-emerald-100 text-emerald-600'}">
                                    <i data-lucide="${modalState.type === 'error' ? 'alert-circle' : 'check-circle'}" class="w-6 h-6"></i>
                                </div>
                                <div>
                                    <h3 class="font-bold text-lg text-slate-900">${modalState.title}</h3>
                                    <p class="text-sm text-slate-600 mt-1">${modalState.message}</p>
                                </div>
                                <div class="flex gap-2 pt-2">
                                    ${modalState.onConfirm ? `
                                        <button onclick="modalState.onConfirm()" class="flex-1 py-2.5 bg-rose-600 text-white font-semibold rounded-xl text-sm">Ya, Lanjutkan</button>
                                        <button onclick="closeModal()" class="flex-1 py-2.5 bg-slate-100 text-slate-700 font-semibold rounded-xl text-sm">Batal</button>
                                    ` : `
                                        <button onclick="closeModal()" class="w-full py-2.5 bg-indigo-600 text-white font-semibold rounded-xl text-sm">Mengerti</button>
                                    `}
                                </div>
                            </div>
                        `}
                    </div>
                </div>
            `;
        }

        window.onload = function() {
            render();
        };
    </script>
</body>
</html>
